# Builds the course image and publishes it to ghcr.io/ppol-6818-2027/course-image.
# Runs on every push to main, every Monday (to pick up package and agent
# updates), and by hand.
name: Build course image
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/ppol-6818-2027/course-image
          imageTag: latest
          push: always
